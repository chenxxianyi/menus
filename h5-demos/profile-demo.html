<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>我的 - Daily Kitchen H5 Demo</title>
  <style>
    :root {
      --text: #2e241f;
      --sub: #7a6a5f;
      --muted: #a19489;
      --cream: rgba(255, 250, 240, 0.78);
      --cream-strong: rgba(255, 252, 246, 0.9);
      --coral: #e95645;
      --coral-2: #ef5548;
      --orange: #f28a2e;
      --sage: #7ea36a;
      --line: rgba(120, 100, 80, 0.14);
      --border: rgba(255, 255, 255, 0.62);
      --shadow: 0 18px 40px rgba(80, 50, 30, 0.15);
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #f4dfc4;
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--text);
      font-family: var(--font);
      background:
        linear-gradient(180deg, rgba(255, 238, 211, 0.4), rgba(255, 246, 233, 0.52) 44%, rgba(234, 192, 145, 0.22)),
        url("../web-user/src/assets/home/kitchen-bg.jpg") center top / cover fixed;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 11%, rgba(255, 255, 255, 0.72), transparent 31%),
        radial-gradient(circle at 79% 3%, rgba(255, 235, 204, 0.34), transparent 30%),
        linear-gradient(180deg, rgba(255, 240, 218, 0.56), rgba(255, 250, 242, 0.28) 50%, rgba(139, 83, 39, 0.1));
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 70px 24px 126px;
    }

    .profile-header {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr) 54px;
      align-items: center;
      gap: 20px;
    }

    .avatar {
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 50%;
      color: #2e241f;
      background:
        radial-gradient(circle at 35% 26%, rgba(255, 255, 255, 0.96), rgba(255, 248, 237, 0.86)),
        rgba(255, 250, 240, 0.88);
      box-shadow:
        0 14px 30px rgba(80, 50, 30, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.92);
      font-size: 31px;
      font-weight: 900;
      line-height: 1;
    }

    .profile-copy {
      min-width: 0;
    }

    .email {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-size: clamp(26px, 7vw, 30px);
      font-weight: 950;
      line-height: 1.12;
      letter-spacing: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .join-text {
      margin: 11px 0 0;
      color: var(--sub);
      font-size: 16px;
      font-weight: 690;
      line-height: 1.2;
    }

    .edit-btn {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 18px;
      color: #8b7d70;
      background: rgba(255, 250, 240, 0.84);
      box-shadow:
        0 12px 26px rgba(80, 50, 30, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: transform 180ms ease, box-shadow 180ms ease, color 180ms ease;
    }

    .edit-btn svg {
      width: 29px;
      height: 29px;
      stroke-width: 2.25;
    }

    .glass-card {
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--cream);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px) saturate(1.08);
      -webkit-backdrop-filter: blur(20px) saturate(1.08);
    }

    .stats-card {
      height: 96px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: center;
      margin-top: 28px;
      overflow: hidden;
    }

    .stat-item {
      position: relative;
      height: 100%;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 9px;
      color: var(--sub);
      background: transparent;
      transition: transform 180ms ease, background 180ms ease;
    }

    .stat-item + .stat-item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 24px;
      width: 1px;
      height: 48px;
      background: rgba(120, 100, 80, 0.16);
    }

    .stat-value {
      display: block;
      color: var(--text);
      font-size: 30px;
      font-weight: 950;
      line-height: 1;
    }

    .stat-label {
      display: block;
      color: #76665a;
      font-size: 14px;
      font-weight: 760;
      line-height: 1;
    }

    .menu-group {
      overflow: hidden;
      margin-top: 27px;
    }

    .menu-group + .menu-group {
      margin-top: 26px;
    }

    .menu-item {
      position: relative;
      width: 100%;
      height: 74px;
      display: flex;
      align-items: center;
      padding: 0 23px;
      color: var(--text);
      background: transparent;
      text-align: left;
      transition: transform 180ms ease, background 180ms ease, opacity 180ms ease;
    }

    .menu-item + .menu-item::before {
      content: "";
      position: absolute;
      left: 80px;
      right: 23px;
      top: 0;
      height: 1px;
      background: var(--line);
    }

    .icon-badge {
      width: 50px;
      height: 50px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--item-color);
      background: var(--item-bg);
    }

    .icon-badge svg {
      width: 28px;
      height: 28px;
      stroke-width: 2.25;
    }

    .menu-label {
      margin-left: 18px;
      color: #2e241f;
      font-size: 21px;
      font-weight: 860;
      letter-spacing: 0;
    }

    .chevron {
      width: 24px;
      height: 24px;
      margin-left: auto;
      color: #8b7d70;
      stroke-width: 2.4;
    }

    .logout {
      width: 100%;
      min-height: 42px;
      margin-top: 40px;
      color: var(--coral);
      background: transparent;
      font-size: 21px;
      font-weight: 850;
      letter-spacing: 0;
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .bottom-tabs {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 8;
      width: min(calc(100% - 48px), 382px);
      height: 74px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: center;
      padding: 0 8px;
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 999px;
      background: rgba(255, 250, 240, 0.9);
      box-shadow:
        0 18px 40px rgba(80, 50, 30, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(22px) saturate(1.08);
      -webkit-backdrop-filter: blur(22px) saturate(1.08);
      transform: translateX(-50%);
    }

    .tab {
      height: 62px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border-radius: 999px;
      color: #8b7d70;
      background: transparent;
      font-size: 13px;
      font-weight: 780;
      line-height: 1;
      transition: color 180ms ease, transform 180ms ease, background 180ms ease;
    }

    .tab svg {
      width: 25px;
      height: 25px;
      stroke-width: 2.25;
    }

    .tab.active {
      color: var(--coral);
      font-weight: 900;
    }

    .edit-btn:active,
    .stat-item:active,
    .menu-item:active,
    .logout:active,
    .tab:active {
      transform: scale(0.98);
    }

    .menu-item:active,
    .stat-item:active {
      background: rgba(255, 255, 255, 0.28);
    }

    @media (hover: hover) {
      .edit-btn:hover,
      .tab:hover {
        transform: translateY(-1px);
      }

      .edit-btn:hover {
        color: var(--coral);
        box-shadow:
          0 15px 30px rgba(80, 50, 30, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.94);
      }

      .menu-item:hover,
      .stat-item:hover {
        background: rgba(255, 255, 255, 0.22);
      }

      .logout:hover {
        opacity: 0.82;
      }
    }

    @media (max-width: 380px) {
      .app {
        padding-left: 20px;
        padding-right: 20px;
      }

      .profile-header {
        grid-template-columns: 72px minmax(0, 1fr) 50px;
        gap: 16px;
      }

      .avatar {
        width: 72px;
        height: 72px;
      }

      .email {
        font-size: 25px;
      }

      .join-text {
        font-size: 15px;
      }

      .edit-btn {
        width: 50px;
        height: 50px;
      }

      .menu-item {
        padding: 0 20px;
      }

      .menu-item + .menu-item::before {
        left: 76px;
        right: 20px;
      }

      .menu-label {
        font-size: 20px;
      }
    }

    @media (min-width: 431px) {
      .app {
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="profile-header" aria-label="个人资料">
      <div class="avatar" aria-label="头像字母 C">C</div>
      <div class="profile-copy">
        <h1 class="email">cxy@qq.com</h1>
        <p class="join-text">加入食刻推荐第 128 天</p>
      </div>
      <button class="edit-btn" type="button" aria-label="编辑个人资料" data-action="编辑个人资料">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
          <path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z" />
        </svg>
      </button>
    </section>

    <section class="glass-card stats-card" aria-label="个人数据统计">
      <button class="stat-item" type="button" data-action="我的收藏统计">
        <span class="stat-value">0</span>
        <span class="stat-label">我的收藏</span>
      </button>
      <button class="stat-item" type="button" data-action="定制菜单统计">
        <span class="stat-value">5</span>
        <span class="stat-label">定制菜单</span>
      </button>
      <button class="stat-item" type="button" data-action="购物清单统计">
        <span class="stat-value">3</span>
        <span class="stat-label">购物清单</span>
      </button>
    </section>

    <section class="glass-card menu-group" aria-label="我的内容">
      <button class="menu-item" type="button" data-action="我的收藏">
        <span class="icon-badge" style="--item-color:#e95645;--item-bg:rgba(233,86,69,0.14);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19.5 12.6 12 20l-7.5-7.4A5 5 0 1 1 12 6.1a5 5 0 1 1 7.5 6.5Z" />
          </svg>
        </span>
        <span class="menu-label">我的收藏</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
      <button class="menu-item" type="button" data-action="我的菜单">
        <span class="icon-badge" style="--item-color:#5f8df7;--item-bg:rgba(95,141,247,0.15);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
            <path d="M14 2v6h6" />
            <path d="M8 13h8M8 17h6M8 9h2" />
          </svg>
        </span>
        <span class="menu-label">我的菜单</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
      <button class="menu-item" type="button" data-action="我的购物清单">
        <span class="icon-badge" style="--item-color:#f28a2e;--item-bg:rgba(242,138,46,0.16);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8" cy="21" r="1" />
            <circle cx="19" cy="21" r="1" />
            <path d="M2.1 2.1h3l2.2 12.4a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.5L21 7H6.2" />
          </svg>
        </span>
        <span class="menu-label">我的购物清单</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    </section>

    <section class="glass-card menu-group" aria-label="偏好与更多">
      <button class="menu-item" type="button" data-action="饮食偏好设置">
        <span class="icon-badge" style="--item-color:#6f8b65;--item-bg:rgba(143,167,131,0.22);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 14h16" />
            <path d="M6 14a6 6 0 0 1 12 0" />
            <path d="M12 5v2" />
            <path d="M8.5 7 10 8.5M15.5 7 14 8.5" />
            <path d="M6 17h12" />
            <path d="M8 20h8" />
          </svg>
        </span>
        <span class="menu-label">饮食偏好设置</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
      <button class="menu-item" type="button" data-action="浏览历史">
        <span class="icon-badge" style="--item-color:#9a7957;--item-bg:rgba(210,170,120,0.20);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
          </svg>
        </span>
        <span class="menu-label">浏览历史</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
      <button class="menu-item" type="button" data-action="关于我们">
        <span class="icon-badge" style="--item-color:#8b715e;--item-bg:rgba(160,130,100,0.18);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 11v5" />
            <path d="M12 8h.01" />
          </svg>
        </span>
        <span class="menu-label">关于我们</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    </section>

    <button class="logout" type="button" data-logout>退出登录</button>
  </main>

  <nav class="bottom-tabs" aria-label="底部导航">
    <button class="tab" type="button" data-tab="home" aria-label="首页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m3 11 9-8 9 8" />
        <path d="M5 10v10h5v-6h4v6h5V10" />
      </svg>
      <span>首页</span>
    </button>
    <button class="tab" type="button" data-tab="recipes" aria-label="菜谱">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 4h11a2 2 0 0 1 2 2v14H8a3 3 0 0 1-3-3V5a1 1 0 0 1 1-1Z" />
        <path d="M8 4v13a3 3 0 0 0 3 3" />
        <path d="M10 8h5M10 12h5" />
      </svg>
      <span>菜谱</span>
    </button>
    <button class="tab" type="button" data-tab="meal-plan" aria-label="菜单推荐">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="7" y="3" width="10" height="18" rx="2" />
        <path d="M9 7h6M9 11h6M9 15h4" />
        <path d="M9 3V2M15 3V2" />
      </svg>
      <span>菜单推荐</span>
    </button>
    <button class="tab active" type="button" data-tab="profile" aria-label="我的">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21a8 8 0 0 1 16 0" />
      </svg>
      <span>我的</span>
    </button>
  </nav>

  <script>
    const actionButtons = document.querySelectorAll("[data-action]");
    actionButtons.forEach((button) => {
      button.addEventListener("click", () => {
        console.log("Profile action:", button.dataset.action);
      });
    });

    const tabs = document.querySelectorAll("[data-tab]");
    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((item) => item.classList.remove("active"));
        tab.classList.add("active");
        console.log("Switch tab:", tab.dataset.tab);
      });
    });

    document.querySelector("[data-logout]").addEventListener("click", () => {
      const confirmed = window.confirm("确认退出登录吗？");
      console.log("Logout confirmed:", confirmed);
    });
  </script>
</body>
</html>
