<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>菜谱 - Daily Kitchen H5 Demo</title>
  <style>
    :root {
      --text: #2e241f;
      --sub: #7a6a5f;
      --muted: #a19489;
      --cream: rgba(255, 250, 240, 0.82);
      --cream-strong: rgba(255, 252, 245, 0.9);
      --coral: #e95645;
      --coral-2: #ef5a4d;
      --orange: #e89a45;
      --sage: #79a35d;
      --line: rgba(255, 255, 255, 0.6);
      --shadow: 0 18px 36px rgba(80, 50, 28, 0.15);
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #f6e7d3;
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--text);
      font-family: var(--font);
      background:
        linear-gradient(180deg, rgba(255, 246, 231, 0.42), rgba(249, 228, 199, 0.58)),
        url("../web-user/src/assets/home/kitchen-bg.jpg") center top / cover fixed;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 20% 8%, rgba(255, 255, 255, 0.66), transparent 33%),
        linear-gradient(90deg, rgba(255, 246, 232, 0.44), rgba(255, 246, 232, 0.1) 55%, rgba(151, 92, 45, 0.08));
      backdrop-filter: blur(4px);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 47px 21px 120px;
    }

    .header {
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--orange);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .title {
      margin: 0;
      color: #30221d;
      font-size: clamp(46px, 12vw, 56px);
      font-weight: 950;
      line-height: 0.96;
      letter-spacing: 0;
    }

    .search {
      height: 66px;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 27px;
      padding: 0 22px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      background: rgba(255, 251, 242, 0.77);
      box-shadow:
        0 14px 30px rgba(90, 60, 35, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px) saturate(1.1);
      -webkit-backdrop-filter: blur(20px) saturate(1.1);
    }

    .search svg {
      width: 31px;
      height: 31px;
      flex: 0 0 auto;
      color: #5f4c43;
      stroke-width: 2.4;
    }

    .search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: #49372f;
      background: transparent;
      font-size: 18px;
      font-weight: 650;
    }

    .search input::placeholder {
      color: #8c7b70;
      opacity: 1;
    }

    .chips {
      display: flex;
      gap: 14px;
      margin: 32px -21px 0;
      padding: 0 21px 3px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      height: 48px;
      padding: 0 24px;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 999px;
      color: #3a2a24;
      background: rgba(255, 250, 240, 0.82);
      box-shadow:
        0 12px 24px rgba(98, 68, 42, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.82);
      font-size: 17px;
      font-weight: 850;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease, color 180ms ease;
    }

    .chip.active {
      border-color: rgba(255, 255, 255, 0.45);
      color: #fff;
      background: linear-gradient(135deg, #ff7568, var(--coral));
      box-shadow: 0 12px 24px rgba(233, 86, 69, 0.26);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 14px;
      margin-top: 29px;
    }

    .card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      background: var(--cream);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px) saturate(1.08);
      -webkit-backdrop-filter: blur(18px) saturate(1.08);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .card-media {
      position: relative;
      height: clamp(132px, 34vw, 152px);
      overflow: hidden;
      background: #f4dfc5 var(--img) center / cover no-repeat;
    }

    .card-media::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 50%;
      background: linear-gradient(180deg, transparent, rgba(92, 54, 25, 0.08));
    }

    .fav {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.74);
      border-radius: 15px;
      color: #8b7b70;
      background: rgba(255, 250, 240, 0.88);
      box-shadow: 0 10px 20px rgba(71, 48, 31, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: transform 180ms ease, color 180ms ease, background 180ms ease;
    }

    .fav svg {
      width: 25px;
      height: 25px;
      fill: transparent;
      stroke-width: 2.1;
    }

    .fav.active {
      color: #fff;
      background: linear-gradient(135deg, #ff7669, var(--coral));
    }

    .fav.active svg {
      fill: currentColor;
    }

    .card-body {
      min-height: 126px;
      display: flex;
      flex-direction: column;
      padding: 14px 16px 16px;
      background: linear-gradient(180deg, rgba(255, 250, 239, 0.78), rgba(255, 249, 237, 0.9));
    }

    .card h2 {
      margin: 0;
      color: #33241e;
      font-size: clamp(20px, 5.1vw, 23px);
      font-weight: 950;
      line-height: 1.14;
      letter-spacing: 0;
    }

    .card p {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      min-height: 43px;
      margin: 9px 0 12px;
      color: var(--sub);
      font-size: 15px;
      font-weight: 560;
      line-height: 1.42;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      align-items: center;
      gap: 11px;
      margin-top: auto;
      color: #554238;
      font-size: 14.5px;
      font-weight: 760;
      white-space: nowrap;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: rgba(141, 112, 92, 0.18);
    }

    .meta span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .meta svg {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      stroke-width: 2.35;
    }

    .clock {
      color: var(--coral);
    }

    .level {
      color: var(--sage);
    }

    .level.orange {
      color: var(--orange);
    }

    .tabbar {
      position: fixed;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 10;
      width: min(calc(100% - 50px), 376px);
      height: 78px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      padding: 8px 13px;
      border: 1px solid rgba(255, 255, 255, 0.74);
      border-radius: 999px;
      background: rgba(255, 250, 240, 0.88);
      box-shadow:
        0 18px 40px rgba(80, 50, 30, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(22px) saturate(1.12);
      -webkit-backdrop-filter: blur(22px) saturate(1.12);
      transform: translateX(-50%);
    }

    .tab {
      height: 62px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 0;
      border-radius: 999px;
      color: #8b7d70;
      background: transparent;
      font-size: 13px;
      font-weight: 800;
      transition: color 180ms ease, transform 180ms ease;
    }

    .tab svg {
      width: 25px;
      height: 25px;
      stroke-width: 2.2;
    }

    .tab.active {
      color: var(--coral);
    }

    .tab:active,
    .chip:active,
    .fav:active,
    .card:active {
      transform: scale(0.98);
    }

    @media (hover: hover) {
      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 22px 42px rgba(80, 50, 28, 0.18);
      }

      .chip:hover,
      .fav:hover,
      .tab:hover {
        transform: translateY(-1px);
      }
    }

    @media (max-width: 380px) {
      .app {
        padding-left: 18px;
        padding-right: 18px;
      }

      .chips {
        margin-left: -18px;
        margin-right: -18px;
        padding-left: 18px;
        padding-right: 18px;
      }

      .grid {
        gap: 16px 12px;
      }

      .card-body {
        padding-left: 13px;
        padding-right: 13px;
      }

      .meta {
        gap: 8px;
        font-size: 13.5px;
      }
    }

    @media (max-width: 350px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card-media {
        height: 176px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="eyebrow">Recipe library</p>
      <h1 class="title">菜谱</h1>

      <label class="search" aria-label="搜索菜名、食材或口味">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="7.2"></circle>
          <path d="m16 16 4.2 4.2"></path>
        </svg>
        <input type="search" placeholder="搜索菜名、食材或口味" />
      </label>
    </header>

    <nav class="chips" aria-label="菜谱分类">
      <button class="chip active" type="button">全部</button>
      <button class="chip" type="button">家常菜</button>
      <button class="chip" type="button">低脂</button>
      <button class="chip" type="button">快手菜</button>
      <button class="chip" type="button">汤羹</button>
    </nav>

    <section class="grid" aria-label="菜谱列表">
      <article class="card" style="--img: url('https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=720&q=88')">
        <div class="card-media">
          <button class="fav" type="button" aria-label="收藏宫保鸡丁">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 1 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6Z"></path></svg>
          </button>
        </div>
        <div class="card-body">
          <h2>宫保鸡丁</h2>
          <p>酸甜微辣，鸡丁滑嫩入味</p>
          <div class="meta">
            <span><svg class="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7v5l3 2"></path></svg>20 分钟</span>
            <i class="divider"></i>
            <span><svg class="level" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 20V9M10 20V4M16 20v-8M22 20H2"></path></svg>下饭菜</span>
          </div>
        </div>
      </article>

      <article class="card" style="--img: url('https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&w=720&q=88')">
        <div class="card-media">
          <button class="fav" type="button" aria-label="收藏红烧肉">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 1 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6Z"></path></svg>
          </button>
        </div>
        <div class="card-body">
          <h2>红烧肉</h2>
          <p>肥而不腻，入口即化</p>
          <div class="meta">
            <span><svg class="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7v5l3 2"></path></svg>90 分钟</span>
            <i class="divider"></i>
            <span><svg class="level orange" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 20V9M10 20V4M16 20v-8M22 20H2"></path></svg>中等</span>
          </div>
        </div>
      </article>

      <article class="card" style="--img: url('https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=720&q=88')">
        <div class="card-media">
          <button class="fav" type="button" aria-label="收藏番茄炒蛋">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 1 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6Z"></path></svg>
          </button>
        </div>
        <div class="card-body">
          <h2>番茄炒蛋</h2>
          <p>酸甜开胃，营养美味</p>
          <div class="meta">
            <span><svg class="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7v5l3 2"></path></svg>15 分钟</span>
            <i class="divider"></i>
            <span><svg class="level" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 20V9M10 20V4M16 20v-8M22 20H2"></path></svg>简单</span>
          </div>
        </div>
      </article>

      <article class="card" style="--img: url('https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=720&q=88')">
        <div class="card-media">
          <button class="fav" type="button" aria-label="收藏菌菇鸡汤">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 1 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6Z"></path></svg>
          </button>
        </div>
        <div class="card-body">
          <h2>菌菇鸡汤</h2>
          <p>鲜香滋补，暖心暖胃</p>
          <div class="meta">
            <span><svg class="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7v5l3 2"></path></svg>60 分钟</span>
            <i class="divider"></i>
            <span><svg class="level" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 20V9M10 20V4M16 20v-8M22 20H2"></path></svg>简单</span>
          </div>
        </div>
      </article>

      <article class="card" style="--img: url('https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=720&q=88')">
        <div class="card-media">
          <button class="fav" type="button" aria-label="收藏西兰花炒牛肉">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 1 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6Z"></path></svg>
          </button>
        </div>
        <div class="card-body">
          <h2>西兰花炒牛肉</h2>
          <p>鲜嫩爽口，营养均衡</p>
          <div class="meta">
            <span><svg class="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7v5l3 2"></path></svg>25 分钟</span>
            <i class="divider"></i>
            <span><svg class="level" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 20V9M10 20V4M16 20v-8M22 20H2"></path></svg>下饭菜</span>
          </div>
        </div>
      </article>

      <article class="card" style="--img: url('https://images.unsplash.com/photo-1534766555764-ce878a5e3a2b?auto=format&fit=crop&w=720&q=88')">
        <div class="card-media">
          <button class="fav" type="button" aria-label="收藏清蒸鲈鱼">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 1 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6Z"></path></svg>
          </button>
        </div>
        <div class="card-body">
          <h2>清蒸鲈鱼</h2>
          <p>鲜嫩原味，清淡营养</p>
          <div class="meta">
            <span><svg class="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7v5l3 2"></path></svg>25 分钟</span>
            <i class="divider"></i>
            <span><svg class="level" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 20V9M10 20V4M16 20v-8M22 20H2"></path></svg>简单</span>
          </div>
        </div>
      </article>
    </section>
  </main>

  <nav class="tabbar" aria-label="底部导航">
    <button class="tab" type="button" aria-label="首页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5.5 9.5V21h13V9.5"></path><path d="M9.5 21v-6h5v6"></path></svg>
      <span>首页</span>
    </button>
    <button class="tab active" type="button" aria-label="菜谱">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v18H7.5A2.5 2.5 0 0 0 5 22V4.5Z"></path><path d="M5 4.5A2.5 2.5 0 0 0 2.5 2H4"></path><path d="M8 7h8M8 11h6"></path></svg>
      <span>菜谱</span>
    </button>
    <button class="tab" type="button" aria-label="菜单推荐">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h4"></path><path d="M8 3V1.8M16 3V1.8"></path></svg>
      <span>菜单推荐</span>
    </button>
    <button class="tab" type="button" aria-label="我的">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.5" r="4"></circle><path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path></svg>
      <span>我的</span>
    </button>
  </nav>

  <script>
    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach((item) => item.classList.remove("active"));
        chip.classList.add("active");
      });
    });

    document.querySelectorAll(".fav").forEach((button) => {
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        button.classList.toggle("active");
      });
    });

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((item) => item.classList.remove("active"));
        tab.classList.add("active");
      });
    });

    document.querySelectorAll(".card").forEach((card) => {
      card.addEventListener("click", () => {
        const title = card.querySelector("h2")?.textContent || "菜谱";
        console.log("open recipe:", title);
      });
    });
  </script>
</body>
</html>
