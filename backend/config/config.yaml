app:
  name: "菜单推荐"
  version: "1.0.0"
  environment: "development"
  debug: true

server:
  host: "0.0.0.0"
  port: 8000

database:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: ""
  dbname: "menu_recommend"
  charset: "utf8mb4"
  loc: "UTC"
  max_idle_conns: 10
  max_open_conns: 20
  conn_max_lifetime_minutes: 30
  auto_migrate: true

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

jwt:
  secret_key: "your-secret-key-change-in-production"
  expire_hours: 24

rate_limit:
  enabled: true
  window_seconds: 60
  auth_per_window: 10
  invite_per_window: 10
  ai_requests_per_window: 5
  upload_per_window: 12
  feedback_per_window: 20
  events_per_window: 120
  ai_concurrent: 4

cors:
  origins:
    - "http://localhost:5173"
    - "http://localhost:5174"
    - "http://localhost:5199"

upload:
  dir: "./uploads"
  max_size: 10485760

ai:
  base_url: ""
  api_key: ""
  model: ""
  timeout_secs: 60
  temperature: 0.2
