<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="common.css">
  <style>
    /* Profile Header */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0 24px;
      text-align: center;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 32px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(245,158,11,0.25), inset 0 2px 0 rgba(255,255,255,0.3);
      border: 3px solid rgba(255,255,255,0.5);
    }

    .profile-name {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .profile-desc {
      font-size: 14px;
      color: var(--text-3);
      margin-top: 4px;
    }

    /* Stats Row */
    .profile-stats {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .profile-stat {
      flex: 1;
      background: var(--card-bg-solid);
      backdrop-filter: blur(16px) saturate(1.3);
      -webkit-backdrop-filter: blur(16px) saturate(1.3);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.45);
      box-shadow: 0 4px 16px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.6);
      padding: 14px 8px;
      text-align: center;
    }

    .profile-stat-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .profile-stat-label {
      font-size: 11px;
      color: var(--text-3);
      font-weight: 500;
      margin-top: 2px;
    }

    /* Menu Card */
    .menu-card {
      background: var(--card-bg-solid);
      backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
      border-radius: 20px;
      border: var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-highlight);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .menu-card-title {
      font-size: 13px;
      color: var(--text-3);
      font-weight: 600;
      padding: 14px 18px 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .menu-card-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .menu-card-item:active { background: rgba(0,0,0,0.03); }

    .menu-card-item + .menu-card-item {
      border-top: 0.5px solid rgba(255,255,255,0.3);
    }

    .menu-card-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.35);
    }

    .menu-card-icon svg { width: 18px; height: 18px; }
    .menu-card-icon.orange { background: rgba(255,224,168,0.5); color: var(--orange-dark); }
    .menu-card-icon.purple { background: rgba(232,223,245,0.5); color: var(--purple-dark); }
    .menu-card-icon.blue { background: rgba(168,216,234,0.5); color: #0284c7; }
    .menu-card-icon.green { background: rgba(184,230,200,0.5); color: #16a34a; }
    .menu-card-icon.yellow { background: rgba(255,243,205,0.5); color: #d97706; }
    .menu-card-icon.red { background: rgba(252,165,165,0.5); color: #dc2626; }

    .menu-card-text { flex: 1; }
    .menu-card-name { font-size: 15px; font-weight: 600; color: var(--text); }
    .menu-card-arrow { color: var(--text-3); flex-shrink: 0; }
    .menu-card-arrow svg { width: 18px; height: 18px; }

    .menu-card-badge {
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(255,224,168,0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.3);
      color: var(--orange-dark);
    }

    /* Version */
    .version-text {
      text-align: center;
      font-size: 12px;
      color: var(--text-3);
      padding: 20px 0 8px;
    }
  </style>
</head>
