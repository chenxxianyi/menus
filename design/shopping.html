<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>购物清单</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <style>
    /* Category Tabs */
    .cat-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .cat-tabs::-webkit-scrollbar { display: none; }

    .cat-tab {
      flex-shrink: 0;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--card-bg-solid);
      backdrop-filter: blur(16px) saturate(1.3);
      -webkit-backdrop-filter: blur(16px) saturate(1.3);
      border: 1px solid rgba(255,255,255,0.45);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      color: var(--text-2);
      white-space: nowrap;
    }

    .cat-tab.active {
      background: var(--navy);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 16px rgba(30,30,46,0.2);
    }

    .cat-tab:active { transform: scale(0.93); }

    .cat-tab-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 700;
      margin-left: 4px;
      padding: 0 5px;
    }

    .cat-tab.active .cat-tab-count {
      background: rgba(255,255,255,0.2);
      color: white;
    }

    .cat-tab:not(.active) .cat-tab-count {
      background: rgba(0,0,0,0.06);
      color: var(--text-3);
    }

    /* Shopping Category Group */
    .shop-group { margin-bottom: 20px; }

    .shop-group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-left: 4px;
    }

    .shop-group-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      background: var(--card-bg-solid);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.4);
    }

    .shop-group-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .shop-group-count {
      font-size: 12px;
      color: var(--text-3);
      font-weight: 500;
      margin-left: auto;
    }

    /* Shopping Item Card */
    .shop-card {
      background: var(--card-bg-solid);
      backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
      border-radius: 16px;
      border: var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-highlight);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .shop-card:active { transform: scale(0.98); }

    .shop-card.checked {
      opacity: 0.5;
    }

    .shop-check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--text-3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .shop-card.checked .shop-check {
      background: var(--green);
      border-color: #16a34a;
    }

    .shop-check svg { width: 14px; height: 14px; color: #16a34a; display: none; }
    .shop-card.checked .shop-check svg { display: block; }

    .shop-emoji {
      font-size: 28px;
      flex-shrink: 0;
    }

    .shop-info { flex: 1; min-width: 0; }

    .shop-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .shop-card.checked .shop-name {
      text-decoration: line-through;
      color: var(--text-3);
    }

    .shop-detail {
      font-size: 12px;
      color: var(--text-3);
      margin-top: 2px;
    }

    .shop-price {
      font-size: 14px;
      font-weight: 700;
      color: var(--orange-dark);
      flex-shrink: 0;
    }

    /* Summary Bar */
    .shop-summary {
      background: var(--card-bg-solid);
      backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
      border-radius: 20px;
      border: var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-highlight);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .shop-summary-left {
      display: flex;
      flex-direction: column;
    }

    .shop-summary-label {
      font-size: 12px;
      color: var(--text-3);
      font-weight: 500;
    }

    .shop-summary-value {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .shop-summary-btn {
      padding: 10px 20px;
      border-radius: 14px;
      border: none;
      background: var(--navy);
      color: white;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(30,30,46,0.2);
      transition: transform 0.15s ease;
    }

    .shop-summary-btn:active { transform: scale(0.96); }

    /* Add Item */
    .add-item-btn {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: 2px dashed rgba(0,0,0,0.1);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-3);
      margin-top: 8px;
      transition: all 0.2s ease;
    }

    .add-item-btn:active { background: rgba(0,0,0,0.03); }
    .add-item-btn svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <div class="page">
    <!-- Header -->
    <header class="header anim">
      <button class="btn-icon" aria-label="返回" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
      <div class="header-center">
        <div class="header-title">购物清单</div>
        <div class="header-sub">根据本周菜单生成</div>
      </div>
      <button class="btn-icon" aria-label="分享">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
      </button>
    </header>

    <!-- Summary -->
    <div class="shop-summary anim d1">
      <div class="shop-summary-left">
        <div class="shop-summary-label">预估总价</div>
        <div class="shop-summary-value">¥ 86.5</div>
      </div>
      <button class="shop-summary-btn">一键复制</button>
    </div>

    <!-- Category Tabs -->
    <div class="cat-tabs anim d2">
      <div class="cat-tab active">全部 <span class="cat-tab-count">12</span></div>
      <div class="cat-tab">蔬菜 <span class="cat-tab-count">4</span></div>
      <div class="cat-tab">肉类 <span class="cat-tab-count">3</span></div>
      <div class="cat-tab">调料 <span class="cat-tab-count">3</span></div>
      <div class="cat-tab">主食 <span class="cat-tab-count">2</span></div>
    </div>

    <!-- Vegetable Group -->
    <div class="shop-group anim d3">
      <div class="shop-group-header">
        <div class="shop-group-icon">🥬</div>
        <div class="shop-group-name">蔬菜水果</div>
        <div class="shop-group-count">4 项</div>
      </div>
      <div class="shop-card" onclick="this.classList.toggle('checked')">
        <div class="shop-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="shop-emoji">🍅</div>
        <div class="shop-info">
          <div class="shop-name">番茄</div>
          <div class="shop-detail">3 个，选红透的</div>
        </div>
        <div class="shop-price">¥8.5</div>
      </div>
      <div class="shop-card" onclick="this.classList.toggle('checked')">
        <div class="shop-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="shop-emoji">🥬</div>
        <div class="shop-info">
          <div class="shop-name">生菜</div>
          <div class="shop-detail">1 颗</div>
        </div>
        <div class="shop-price">¥3.0</div>
      </div>
      <div class="shop-card" onclick="this.classList.toggle('checked')">
        <div class="shop-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="shop-emoji">🧅</div>
        <div class="shop-info">
          <div class="shop-name">大葱</div>
          <div class="shop-detail">2 根</div>
        </div>
        <div class="shop-price">¥2.0</div>
      </div>
      <div class="shop-card checked" onclick="this.classList.toggle('checked')">
        <div class="shop-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="shop-emoji">🥒</div>
        <div class="shop-info">
          <div class="shop-name">黄瓜</div>
          <div class="shop-detail">2 根</div>
        </div>
        <div class="shop-price">¥4.0</div>
      </div>
    </div>

    <!-- Meat Group -->
    <div class="shop-group anim d4">
      <div class="shop-group-header">
        <div class="shop-group-icon">🥩</div>
        <div class="shop-group-name">肉蛋水产</div>
        <div class="shop-group-count">3 项</div>
      </div>
      <div class="shop-card" onclick="this.classList.toggle('checked')">
        <div class="shop-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="shop-emoji">🍖</div>
        <div class="shop-info">
          <div class="shop-name">排骨</div>
          <div class="shop-detail">500g，肋排</div>
        </div>
        <div class="shop-price">¥38.0</div>
      </div>
      <div class="shop-card" onclick="this.classList.toggle('checked')">
        <div class="shop-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="shop-emoji">🥚</div>
        <div class="shop-info">
          <div class="shop-name">鸡蛋</div>
          <div class="shop-detail">10 枚</div>
        </div>
        <div class="shop-price">¥12.0</div>
      </div>
      <div class="shop-card" onclick="this.classList.toggle('checked')">
        <div class="shop-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="shop-emoji">🐔</div>
        <div class="shop-info">
          <div class="shop-name">鸡胸肉</div>
          <div class="shop-detail">300g</div>
        </div>
        <div class="shop-price">¥11.0</div>
      </div>
    </div>

    <!-- Seasoning Group -->
    <div class="shop-group anim d5">
      <div class="shop-group-header">
        <div class="shop-group-icon">🧂</div>
        <div class="shop-group-name">调料干货</div>
        <div class="shop-group-count">3 项</div>
      </div>
      <div class="shop-card" onclick="this.classList.toggle('checked')">
        <div class="shop-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="shop-emoji">🫙</div>
        <div class="shop-info">
          <div class="shop-name">冰糖</div>
          <div class="shop-detail">200g 袋装</div>
        </div>
        <div class="shop-price">¥5.0</div>
      </div>
      <div class="shop-card checked" onclick="this.classList.toggle('checked')">
        <div class="shop-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="shop-emoji">🍶</div>
        <div class="shop-info">
          <div class="shop-name">料酒</div>
          <div class="shop-detail">家中已有</div>
        </div>
        <div class="shop-price">¥0</div>
      </div>
      <div class="shop-card" onclick="this.classList.toggle('checked')">
        <div class="shop-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="shop-emoji">🍜</div>
        <div class="shop-info">
          <div class="shop-name">挂面</div>
          <div class="shop-detail">500g</div>
        </div>
        <div class="shop-price">¥6.0</div>
      </div>
    </div>

    <!-- Add Button -->
    <button class="add-item-btn anim d6">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      手动添加
    </button>
  </div>

  <script>
    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
