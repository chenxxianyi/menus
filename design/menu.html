<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>一周菜单</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <style>
    /* Week Tab */
    .week-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 4px;
    }
    .week-tabs::-webkit-scrollbar { display: none; }

    .week-tab {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 52px;
      background: var(--card-bg-solid);
      backdrop-filter: blur(16px) saturate(1.3);
      -webkit-backdrop-filter: blur(16px) saturate(1.3);
      border: 1px solid rgba(255,255,255,0.45);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .week-tab.active {
      background: var(--navy);
      color: white;
      border-color: transparent;
      box-shadow: 0 6px 20px rgba(30,30,46,0.25);
    }

    .week-tab:active { transform: scale(0.93); }

    .week-day { font-size: 11px; font-weight: 600; color: var(--text-3); }
    .week-tab.active .week-day { color: rgba(255,255,255,0.7); }
    .week-date { font-size: 16px; font-weight: 700; color: var(--text); }
    .week-tab.active .week-date { color: white; }
    .week-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--orange); }
    .week-tab.active .week-dot { background: var(--orange); }

    /* Meal Timeline */
    .timeline { margin-bottom: 24px; }

    .timeline-item {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
      position: relative;
    }

    .timeline-dot-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      width: 52px;
    }

    .timeline-time {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-3);
      white-space: nowrap;
    }

    .timeline-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .timeline-dot.breakfast { background: var(--orange); box-shadow: 0 2px 8px rgba(255,179,71,0.3); }
    .timeline-dot.lunch { background: var(--blue); box-shadow: 0 2px 8px rgba(168,216,234,0.3); }
    .timeline-dot.dinner { background: var(--purple); box-shadow: 0 2px 8px rgba(184,169,232,0.3); }

    .timeline-line {
      width: 2px;
      flex: 1;
      background: linear-gradient(180deg, rgba(0,0,0,0.08) 0%, transparent 100%);
      min-height: 20px;
    }

    .timeline-card {
      flex: 1;
      background: var(--card-bg-solid);
      backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
      border-radius: 18px;
      border: var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-highlight);
      padding: 14px 16px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .timeline-card:active { transform: scale(0.97); }

    .timeline-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .timeline-card-type {
      font-size: 12px;
      font-weight: 600;
    }

    .timeline-card-type.breakfast { color: var(--orange-dark); }
    .timeline-card-type.lunch { color: #0284c7; }
    .timeline-card-type.dinner { color: var(--purple-dark); }

    .timeline-card-kcal {
      font-size: 12px;
      color: var(--text-3);
      font-weight: 500;
    }

    .timeline-card-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .timeline-card-desc {
      font-size: 13px;
      color: var(--text-3);
      line-height: 1.5;
    }

    .timeline-card-tags {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .timeline-card-tag {
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.4);
    }

    .timeline-card-images {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .timeline-card-img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.6);
    }

    .timeline-card-img-placeholder {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border: 2px solid rgba(255,255,255,0.6);
    }

    /* Add Button */
    .add-meal-btn {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: 2px dashed rgba(0,0,0,0.1);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-3);
      transition: all 0.2s ease;
    }

    .add-meal-btn:active { background: rgba(0,0,0,0.03); }
    .add-meal-btn svg { width: 20px; height: 20px; }

    /* Summary Bar */
    .summary-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .summary-item {
      flex: 1;
      background: var(--card-bg-solid);
      backdrop-filter: blur(16px) saturate(1.3);
      -webkit-backdrop-filter: blur(16px) saturate(1.3);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.45);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04), inset 0 1px 0 rgba(255,255,255,0.6);
      padding: 12px 10px;
      text-align: center;
    }

    .summary-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .summary-label {
      font-size: 11px;
      color: var(--text-3);
      font-weight: 500;
      margin-top: 2px;
    }

    .summary-item.orange .summary-value { color: var(--orange-dark); }
    .summary-item.blue .summary-value { color: #0284c7; }
    .summary-item.green .summary-value { color: #16a34a; }
  </style>
</head>
<body>
  <div class="page">
    <!-- Header -->
    <header class="header anim">
      <button class="btn-icon" aria-label="返回" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
      <div class="header-center">
        <div class="header-title">一周菜单</div>
      </div>
      <button class="btn-icon" aria-label="生成菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </header>

    <!-- Week Tabs -->
    <div class="week-tabs anim d1">
      <div class="week-tab" data-day="1">
        <span class="week-day">一</span>
        <span class="week-date">12</span>
      </div>
      <div class="week-tab" data-day="2">
        <span class="week-day">二</span>
        <span class="week-date">13</span>
      </div>
      <div class="week-tab active" data-day="3">
        <span class="week-day">三</span>
        <span class="week-date">14</span>
        <div class="week-dot"></div>
      </div>
      <div class="week-tab" data-day="4">
        <span class="week-day">四</span>
        <span class="week-date">15</span>
      </div>
      <div class="week-tab" data-day="5">
        <span class="week-day">五</span>
        <span class="week-date">16</span>
      </div>
      <div class="week-tab" data-day="6">
        <span class="week-day">六</span>
        <span class="week-date">17</span>
      </div>
      <div class="week-tab" data-day="0">
        <span class="week-day">日</span>
        <span class="week-date">18</span>
      </div>
    </div>

    <!-- Daily Summary -->
    <div class="summary-bar anim d2">
      <div class="summary-item orange">
        <div class="summary-value">1,850</div>
        <div class="summary-label">总热量 kcal</div>
      </div>
      <div class="summary-item blue">
        <div class="summary-value">3 餐</div>
        <div class="summary-label">已规划</div>
      </div>
      <div class="summary-item green">
        <div class="summary-value">92%</div>
        <div class="summary-label">营养达标</div>
      </div>
    </div>

    <!-- Meal Timeline -->
    <div class="timeline anim d3">
      <!-- Breakfast -->
      <div class="timeline-item">
        <div class="timeline-dot-wrap">
          <div class="timeline-time">07:30</div>
          <div class="timeline-dot breakfast"></div>
          <div class="timeline-line"></div>
        </div>
        <div class="timeline-card" onclick="location.href='recipe.html'">
          <div class="timeline-card-header">
            <span class="timeline-card-type breakfast">早餐</span>
            <span class="timeline-card-kcal">420 kcal</span>
          </div>
          <div class="timeline-card-name">鸡蛋三明治 + 牛奶</div>
          <div class="timeline-card-desc">全麦面包搭配煎蛋、生菜、番茄，配一杯温牛奶</div>
          <div class="timeline-card-tags">
            <span class="timeline-card-tag tag-orange">高蛋白</span>
            <span class="timeline-card-tag tag-green">低脂</span>
          </div>
          <div class="timeline-card-images">
            <div class="timeline-card-img-placeholder" style="background: rgba(255,224,168,0.4);">🥪</div>
            <div class="timeline-card-img-placeholder" style="background: rgba(168,216,234,0.4);">🥛</div>
          </div>
        </div>
      </div>

      <!-- Lunch -->
      <div class="timeline-item">
        <div class="timeline-dot-wrap">
          <div class="timeline-time">12:00</div>
          <div class="timeline-dot lunch"></div>
          <div class="timeline-line"></div>
        </div>
        <div class="timeline-card" onclick="location.href='recipe.html'">
          <div class="timeline-card-header">
            <span class="timeline-card-type lunch">午餐</span>
            <span class="timeline-card-kcal">680 kcal</span>
          </div>
          <div class="timeline-card-name">红烧排骨 + 清炒时蔬</div>
          <div class="timeline-card-desc">经典家常菜搭配，荤素均衡，软烂入味</div>
          <div class="timeline-card-tags">
            <span class="timeline-card-tag tag-blue">荤素搭配</span>
            <span class="timeline-card-tag tag-orange">30分钟</span>
          </div>
          <div class="timeline-card-images">
            <div class="timeline-card-img-placeholder" style="background: rgba(252,165,165,0.4);">🍖</div>
            <div class="timeline-card-img-placeholder" style="background: rgba(184,230,200,0.4);">🥬</div>
          </div>
        </div>
      </div>

      <!-- Dinner -->
      <div class="timeline-item">
        <div class="timeline-dot-wrap">
          <div class="timeline-time">18:30</div>
          <div class="timeline-dot dinner"></div>
        </div>
        <div class="timeline-card" onclick="location.href='recipe.html'">
          <div class="timeline-card-header">
            <span class="timeline-card-type dinner">晚餐</span>
            <span class="timeline-card-kcal">520 kcal</span>
          </div>
          <div class="timeline-card-name">番茄鸡蛋面</div>
          <div class="timeline-card-desc">酸甜开胃，简单快手，适合晚餐轻食</div>
          <div class="timeline-card-tags">
            <span class="timeline-card-tag tag-purple">快手菜</span>
            <span class="timeline-card-tag tag-green">清淡</span>
          </div>
          <div class="timeline-card-images">
            <div class="timeline-card-img-placeholder" style="background: rgba(252,165,165,0.4);">🍅</div>
            <div class="timeline-card-img-placeholder" style="background: rgba(255,243,205,0.4);">🍜</div>
          </div>
        </div>
      </div>

      <!-- Add Meal -->
      <div class="timeline-item">
        <div class="timeline-dot-wrap">
          <div class="timeline-line" style="background:transparent;"></div>
        </div>
        <button class="add-meal-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          添加加餐
        </button>
      </div>
    </div>
  </div>

  <!-- Tab Bar -->
  <nav class="tabbar" role="navigation">
    <a class="tab" href="home.html" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </a>
    <a class="tab active" href="menu.html" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      </svg>
    </a>
    <a class="tab" href="stats.html" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 20V10"/>
        <path d="M12 20V4"/>
        <path d="M6 20v-6"/>
      </svg>
    </a>
    <a class="tab" href="profile.html" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </a>
  </nav>

  <script>
    document.querySelectorAll('.week-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.week-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
