<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>营养统计</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <style>
    /* Overview Cards */
    .overview-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .overview-card {
      background: var(--card-bg-solid);
      backdrop-filter: blur(16px) saturate(1.3);
      -webkit-backdrop-filter: blur(16px) saturate(1.3);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.45);
      box-shadow: 0 4px 16px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.6);
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .overview-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 60%);
      pointer-events: none;
    }

    .overview-card-label {
      font-size: 12px;
      color: var(--text-3);
      font-weight: 500;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
    }

    .overview-card-value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.8px;
      position: relative;
      z-index: 1;
    }

    .overview-card-unit {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-3);
    }

    .overview-card-change {
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
      position: relative;
      z-index: 1;
    }

    .overview-card-change.up { color: #16a34a; }
    .overview-card-change.down { color: #dc2626; }

    .overview-card.orange .overview-card-value { color: var(--orange-dark); }
    .overview-card.blue .overview-card-value { color: #0284c7; }
    .overview-card.green .overview-card-value { color: #16a34a; }
    .overview-card.purple .overview-card-value { color: var(--purple-dark); }

    /* Chart Container */
    .chart-card {
      background: var(--card-bg-solid);
      backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
      border-radius: 20px;
      border: var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-highlight);
      padding: 18px;
      margin-bottom: 20px;
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .chart-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .chart-toggle {
      display: flex;
      gap: 4px;
      background: rgba(0,0,0,0.04);
      border-radius: 10px;
      padding: 3px;
    }

    .chart-toggle-btn {
      padding: 5px 12px;
      border-radius: 8px;
      border: none;
      background: transparent;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chart-toggle-btn.active {
      background: white;
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    /* Bar Chart */
    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 140px;
      padding-top: 10px;
    }

    .bar-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      height: 100%;
      justify-content: flex-end;
    }

    .bar {
      width: 100%;
      border-radius: 8px 8px 4px 4px;
      position: relative;
      transition: height 0.5s cubic-bezier(0.25,0.46,0.45,0.94);
      min-height: 4px;
    }

    .bar.orange { background: linear-gradient(180deg, var(--orange) 0%, var(--orange-dark) 100%); }
    .bar.blue { background: linear-gradient(180deg, var(--blue) 0%, #6cb4d8 100%); }
    .bar.green { background: linear-gradient(180deg, var(--green) 0%, #7dd3a0 100%); }
    .bar.purple { background: linear-gradient(180deg, var(--purple) 0%, var(--purple-dark) 100%); }

    .bar-label {
      font-size: 11px;
      color: var(--text-3);
      font-weight: 500;
    }

    .bar-value {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-2);
    }

    /* Donut Chart */
    .donut-wrap {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .donut {
      width: 120px;
      height: 120px;
      flex-shrink: 0;
    }

    .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .donut circle { fill: none; stroke-width: 10; stroke-linecap: round; }
    .donut .track { stroke: rgba(0,0,0,0.05); }
    .donut .seg-1 { stroke: var(--orange); stroke-dasharray: 94 220; }
    .donut .seg-2 { stroke: var(--blue); stroke-dasharray: 66 220; stroke-dashoffset: -94; }
    .donut .seg-3 { stroke: var(--green); stroke-dasharray: 44 220; stroke-dashoffset: -160; }
    .donut .seg-4 { stroke: var(--purple); stroke-dasharray: 22 220; stroke-dashoffset: -204; }

    .donut-center {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .donut-legend {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-dot.orange { background: var(--orange); }
    .legend-dot.blue { background: var(--blue); }
    .legend-dot.green { background: var(--green); }
    .legend-dot.purple { background: var(--purple); }

    .legend-text { font-size: 13px; color: var(--text-2); }
    .legend-value { font-size: 13px; font-weight: 700; color: var(--text); margin-left: auto; }

    /* Streak */
    .streak-card {
      background: linear-gradient(135deg, var(--navy) 0%, #2d2d44 100%);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .streak-card::after {
      content: '';
      position: absolute;
      top: -20px;
      right: -20px;
      width: 100px;
      height: 100px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }

    .streak-title {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      font-weight: 500;
      margin-bottom: 6px;
    }

    .streak-value {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .streak-unit {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
    }

    .streak-bar {
      display: flex;
      gap: 4px;
      margin-top: 14px;
    }

    .streak-day {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.12);
    }

    .streak-day.done { background: var(--orange); }
    .streak-day.today { background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.5); }
  </style>
</head>
<body>
  <div class="page">
    <!-- Header -->
    <header class="header anim">
      <div style="width:40px;"></div>
      <div class="header-center">
        <div class="header-title">营养统计</div>
        <div class="header-sub">本周数据</div>
      </div>
      <button class="btn-icon" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </header>

    <!-- Streak -->
    <div class="streak-card anim d1">
      <div class="streak-title">连续记录天数</div>
      <div class="streak-value">14 <span class="streak-unit">天</span></div>
      <div class="streak-bar">
        <div class="streak-day done"></div>
        <div class="streak-day done"></div>
        <div class="streak-day done"></div>
        <div class="streak-day done"></div>
        <div class="streak-day done"></div>
        <div class="streak-day done"></div>
        <div class="streak-day today"></div>
      </div>
    </div>

    <!-- Overview -->
    <div class="overview-row anim d2">
      <div class="overview-card orange">
        <div class="overview-card-label">今日热量</div>
        <div class="overview-card-value">1,850 <span class="overview-card-unit">kcal</span></div>
        <div class="overview-card-change down">-120 vs 昨日</div>
      </div>
      <div class="overview-card blue">
        <div class="overview-card-label">蛋白质摄入</div>
        <div class="overview-card-value">98 <span class="overview-card-unit">g</span></div>
        <div class="overview-card-change up">+15 达标</div>
      </div>
      <div class="overview-card green">
        <div class="overview-card-label">蔬菜摄入</div>
        <div class="overview-card-value">420 <span class="overview-card-unit">g</span></div>
        <div class="overview-card-change up">+80 达标</div>
      </div>
      <div class="overview-card purple">
        <div class="overview-card-label">饮水量</div>
        <div class="overview-card-value">1.8 <span class="overview-card-unit">L</span></div>
        <div class="overview-card-change down">-0.2 待补充</div>
      </div>
    </div>

    <!-- Weekly Calories Chart -->
    <div class="chart-card anim d3">
      <div class="chart-header">
        <div class="chart-title">每周热量</div>
        <div class="chart-toggle">
          <button class="chart-toggle-btn active">周</button>
          <button class="chart-toggle-btn">月</button>
        </div>
      </div>
      <div class="bar-chart">
        <div class="bar-group">
          <div class="bar-value">1720</div>
          <div class="bar orange" style="height: 72%;"></div>
          <div class="bar-label">一</div>
        </div>
        <div class="bar-group">
          <div class="bar-value">1950</div>
          <div class="bar orange" style="height: 85%;"></div>
          <div class="bar-label">二</div>
        </div>
        <div class="bar-group">
          <div class="bar-value">1850</div>
          <div class="bar orange" style="height: 80%;"></div>
          <div class="bar-label">三</div>
        </div>
        <div class="bar-group">
          <div class="bar-value">2100</div>
          <div class="bar orange" style="height: 92%;"></div>
          <div class="bar-label">四</div>
        </div>
        <div class="bar-group">
          <div class="bar-value">1680</div>
          <div class="bar orange" style="height: 70%;"></div>
          <div class="bar-label">五</div>
        </div>
        <div class="bar-group">
          <div class="bar-value">1980</div>
          <div class="bar orange" style="height: 87%;"></div>
          <div class="bar-label">六</div>
        </div>
        <div class="bar-group">
          <div class="bar-value">1850</div>
          <div class="bar orange" style="height: 80%;"></div>
          <div class="bar-label">日</div>
        </div>
      </div>
    </div>

    <!-- Macro Breakdown -->
    <div class="chart-card anim d4">
      <div class="chart-header">
        <div class="chart-title">营养素分布</div>
      </div>
      <div class="donut-wrap">
        <div class="donut">
          <svg viewBox="0 0 100 100">
            <circle class="track" cx="50" cy="50" r="35"/>
            <circle class="seg-1" cx="50" cy="50" r="35"/>
            <circle class="seg-2" cx="50" cy="50" r="35"/>
            <circle class="seg-3" cx="50" cy="50" r="35"/>
            <circle class="seg-4" cx="50" cy="50" r="35"/>
          </svg>
        </div>
        <div class="donut-legend">
          <div class="legend-item">
            <div class="legend-dot orange"></div>
            <span class="legend-text">碳水化合物</span>
            <span class="legend-value">42%</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot blue"></div>
            <span class="legend-text">蛋白质</span>
            <span class="legend-value">30%</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot green"></div>
            <span class="legend-text">脂肪</span>
            <span class="legend-value">20%</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot purple"></div>
            <span class="legend-text">膳食纤维</span>
            <span class="legend-value">8%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Meal Distribution -->
    <div class="chart-card anim d5">
      <div class="chart-header">
        <div class="chart-title">三餐热量分布</div>
      </div>
      <div class="bar-chart">
        <div class="bar-group">
          <div class="bar-value">420</div>
          <div class="bar orange" style="height: 55%;"></div>
          <div class="bar-label">早餐</div>
        </div>
        <div class="bar-group">
          <div class="bar-value">680</div>
          <div class="bar blue" style="height: 90%;"></div>
          <div class="bar-label">午餐</div>
        </div>
        <div class="bar-group">
          <div class="bar-value">520</div>
          <div class="bar purple" style="height: 68%;"></div>
          <div class="bar-label">晚餐</div>
        </div>
        <div class="bar-group">
          <div class="bar-value">230</div>
          <div class="bar green" style="height: 30%;"></div>
          <div class="bar-label">加餐</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab Bar -->
  <nav class="tabbar" role="navigation">
    <a class="tab" href="home.html" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </a>
    <a class="tab" href="menu.html" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      </svg>
    </a>
    <a class="tab active" href="stats.html" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 20V10"/>
        <path d="M12 20V4"/>
        <path d="M6 20v-6"/>
      </svg>
    </a>
    <a class="tab" href="profile.html" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </a>
  </nav>

  <script>
    document.querySelectorAll('.chart-toggle-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        this.parentElement.querySelectorAll('.chart-toggle-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
